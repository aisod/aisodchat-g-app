  name: Build Android APK
  
  on:
    workflow_dispatch:
    push:
      branches: [ "main" ]
      paths:
        - 'Android/**'
        - '.github/workflows/build_android.yaml'
    pull_request:
      branches: [ "main" ]
      paths:
        - 'Android/**'
  
  permissions:
    contents: write
  
  jobs:
    build_apk:
      name: Build Android APK
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./Android/src
      steps:
        - name: Checkout the source code
          uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '21'
        - name: Install Android SDK Platform 37
          run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
        - name: Build
          run: |
            chmod +x gradlew
            ./gradlew assembleRelease
        - name: Rename APK
          run: cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/AISODChat-build-${{ github.run_number }}.apk"
        - name: Upload APK artifact
          uses: actions/upload-artifact@v4
          with:
            name: AISODChat-apk
            path: AISODChat-build-${{ github.run_number }}.apk
        - name: Publish GitHub Release
          if: github.event_name != 'pull_request'
          working-directory: ${{ github.workspace }}
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            gh release create "build-${{ github.run_number }}" \
              "AISODChat-build-${{ github.run_number }}.apk" \
              --target "${{ github.sha }}" \
              --title "AISODChat build ${{ github.run_number }}" \
              --notes "Automated APK build from commit ${{ github.sha }}." \
              --latest
